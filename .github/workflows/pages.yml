# The review page as a static site on GitHub Pages: images load from the data folder; answers go to the lab's
# relay (RETIFY_LABELS_URL, relay/relay.py) when it is set, and otherwise stay in the reviewer's browser.
# The images are not part of the site; the page loads them from RETIFY_DATA_URL (a repository variable,
# e.g. a Hugging Face dataset at a version tag, https://huggingface.co/datasets/<owner>/<repo>/resolve/<tag>/),
# which must allow cross-origin requests. Without that variable the page is still published and says that
# it has no image folder.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point the page at the data and the relay
        if: vars.RETIFY_DATA_URL != ''
        env:
          DATA_URL: ${{ vars.RETIFY_DATA_URL }}
          LABELS_URL: ${{ vars.RETIFY_LABELS_URL }}
        run: |
          printf 'window.RETIFY_DATA_URL = %s;\nwindow.RETIFY_LABELS_URL = %s;\n' \
            "$(jq -Rn --arg u "$DATA_URL" '$u')" "$(jq -Rn --arg u "$LABELS_URL" '$u')" > web/config.js
          cat web/config.js
      - name: Check that the relay answers the page
        if: vars.RETIFY_LABELS_URL != ''
        env:
          LABELS_URL: ${{ vars.RETIFY_LABELS_URL }}
        run: |
          curl -sf -H 'Origin: https://retinal-research.github.io' "${LABELS_URL%/}/status" | jq -e .ok > /dev/null \
            || echo "::warning::the relay at $LABELS_URL/status does not answer; answers will wait in reviewers' browsers until it does"
      - name: Check that the data is reachable from a browser
        if: vars.RETIFY_DATA_URL != ''
        env:
          DATA_URL: ${{ vars.RETIFY_DATA_URL }}
        run: |
          url="${DATA_URL%/}/manifest.json"
          curl -sfIL -H 'Origin: https://example.github.io' "$url" | grep -qi '^access-control-allow-origin' \
            || { echo "::error::$url is missing or does not allow cross-origin requests"; exit 1; }
          first=$(curl -sfL "$url" | jq -r '.sets[0].dir + .sets[0].cases[0]')
          curl -sfIL "${DATA_URL%/}/$first" > /dev/null || { echo "::error::first image $first is missing"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
